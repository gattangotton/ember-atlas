<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>ログイン｜EMBER ATLAS</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="login.css"></head><body><main class="login-card"><a class="brand" href="./">◇ EMBER ATLAS</a><span class="eyebrow">PRIVATE TEST</span><h1>テスト版へようこそ</h1><p>案内されたパスワードでログインしてください。</p><form id="login-form"><label>利用区分<select name="role"><option value="user">参加者</option><option value="admin">管理者</option></select></label><label>パスワード<input name="password" type="password" autocomplete="current-password" required maxlength="1024" autofocus></label><p id="login-error" role="alert"></p><button type="submit">ログイン</button></form><p class="storage-note">個人の記録は、このブラウザーに保存されます。いつも使うブラウザーで開き、定期的にバックアップしてください。</p><p id="local-note" hidden>ローカル起動ではログインは不要です。<a href="./">アプリを開く →</a></p></main><script type="module" src="login.js"></script></body></html>

<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ログイン｜EMBER ATLAS</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="cloud.css"></head>
<body class="cloud-auth"><main class="panel cloud-auth-card"><p class="eyebrow">EMBER ATLAS</p><h1>同盟の攻略ノート</h1><p>同じアカウントでログインすると、どの端末でも自分の記録を使えます。</p><section class="guest-entry"><a class="guest-entry-link" href="./?mode=guest#home">ログインせずに利用する</a><p>攻略データの閲覧・計算ができます。個人記録はこのブラウザー内に保存され、同盟ルームは利用できません。</p></section><nav class="actions" aria-label="手続き"><button type="button" data-view="login">ログイン</button><button type="button" data-view="register">招待から参加</button></nav><div id="auth-form"></div><p id="auth-status" role="status" aria-live="polite"></p><details><summary>パスワードを忘れた場合</summary><p>全体管理者に本人確認を依頼し、15分間有効の再設定リンクを受け取ってください。</p></details><p class="hint"><a href="?setup">初回のサーバー設定</a></p></main><script type="module" src="cloud-login.js"></script></body></html>
